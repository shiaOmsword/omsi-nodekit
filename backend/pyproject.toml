[tool.poetry]
name = "backend"
version = "0.1.0"
description = "Local control panel for reproducible 3x-ui nodes"
authors = ["Omsi"]
packages = [{ include = "app", from = "src" }, { include = "framework", from = "src" }]

[tool.poetry.scripts]
nodekit = "app.main:main"

[tool.poetry.dependencies]
python = "^3.12"
httpx = "^0.28.1"
pydantic = "^2.14.2"
pydantic-settings = "^2.16.2"
python-dotenv = "^1.2.4"
rich = "^15.0.0"
pyyaml = "^6.0.3"
typer = "^0.27.3"
punq = "^0.9.0"

fastapi = "^0.162.0"
uvicorn = "^0.54.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
ruff = "^0.17.3"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
