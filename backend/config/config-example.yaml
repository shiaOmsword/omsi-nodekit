# Local computer -> VPS. Paths here refer to YOUR computer (WSL is supported).
id: moscow-1
name: Москва · основная
ssh:
  host: 203.0.113.10
  user: root
  port: 22
  identity_file: ~/.ssh/id_ed25519
  # key_id: <ID выбранного ключа из локальной панели; identity_file тогда не используется>
  known_hosts_file: ~/.ssh/known_hosts
  sudo: false  # true for a non-root sudo user
  # If sudo needs a password, choose ONE source:
  # sudo_password: 'your sudo password'  # stored with the local YAML
  # sudo_password_env: OMSI_SUDO_PASSWORD  # environment of the local backend process

panel:
  installation: managed  # existing installation: auto, native or docker
  # service: x-ui               # native systemd service
  # container: my-3x-ui         # existing Docker container
  # database_path: /etc/x-ui/x-ui.db  # native host path / Docker container path
  # For restore, set EXACTLY the version that created your backup.
  image: ghcr.io/mhsanaei/3x-ui:3.11.0
  port: 2053
  base_path: /nodekit/  # must match the backup when restoring
  subscription_port: 2097
  subscription_path: /sub/  # must match the backup when restoring

caddy:
  enabled: true  # existing Caddy is discovered independently
  # service: caddy
  # config_path: /etc/caddy/Caddyfile  # existing config (container path in Docker)
  image: caddy:2.10.2-alpine
  domain: vpn.example.com
  https_port: 2096  # 443 is reserved for Xray; ACME HTTP challenge needs port 80

# Tunnel keys and known_hosts below must already exist ON THE VPS.
# SSH ports 22 and 2222 are pre-configured on the destination manually.
# Each entry starts a separate systemd/SSH process.
tunnels: []
#  - name: gb-22
#    host: 203.0.113.20
#    user: omsi
#    ssh_port: 22
#    local_port: 15443
#    target_port: 443
#    identity_file: /home/omsi/.ssh/gb_xray_tunnel
#    known_hosts_file: /home/omsi/.ssh/known_hosts
#  - name: gb-2222
#    host: 203.0.113.20
#    user: omsi
#    ssh_port: 2222
#    local_port: 15444
#    target_port: 443
#    identity_file: /home/omsi/.ssh/gb_xray_tunnel
#    known_hosts_file: /home/omsi/.ssh/known_hosts

# Optional: existing SOCKS inbound ON THE VPS routed through your outbound.
# A successful TCP connection alone does not prove that VPN traffic works.
probe: null
# probe:
#   socks_port: 10808
#   url: https://www.cloudflare.com/cdn-cgi/trace

# Destination runtime is independent of the SQLite backup source.
deployment:
  role: ingress
  panel_runtime: docker
  caddy_mode: docker
  subscription_bind: 127.0.0.1
  install_docker: false
